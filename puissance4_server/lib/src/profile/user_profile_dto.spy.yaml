# DTO renvoyé par ProfileEndpoint.getMyProfile() (doc/05-endpoints.md) —
# pas de `table:` : simple modèle sérialisable, pas persisté.
class: UserProfileDto
fields:
  id: UuidValue
  username: String
  thumbnailUrl: String?
  elo: int
  nbParties: int
  nbVictoires: int
  # Connecté en anonyme (E0) : peut encore créer un compte email sans perdre
  # sa progression (US0.2).
  isGuest: bool, default=false
