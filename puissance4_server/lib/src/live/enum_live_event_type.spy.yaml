# Ce qui a changé côté serveur — le client s'en sert pour savoir quel écran
# recharger (voir LiveEndpoint.watchUpdates).
enum: EnumLiveEventType
values:
  - profileChanged
  - historyChanged
  - leaderboardChanged
  # Lobby Multi : une salle publique a été ouverte, fermée, prise ou a expiré
  # (canal `multi.lobby`, cf. MultiplayerEndpoint.watchLobby).
  - lobbyChanged
  # Amis (E15) : demande reçue, acceptée, refusée, annulée ou ami retiré.
  - friendsChanged
  # Défi d'un ami reçu, retiré ou expiré (E15, `FriendsEndpoint.getChallenges`).
  - challengesChanged
