name: _
publish_to: none

environment:
  sdk: '^3.12.2'

workspace:
  - puissance4_client
  - puissance4_server
  - puissance4_flutter
  - puissance4_rules
  - packages/assistant_contracts
  - packages/assistant_ui

# sqlite3_web 0.9.5 rend `WorkerDatabase` `base` : sqlite_async 0.14.5 (tiré
# par serverpod_offline_sync, dernière version à ce jour) ne compile plus
# pour le web. À retirer dès qu'un sqlite_async compatible sort.
dependency_overrides:
  sqlite3_web: 0.9.4
